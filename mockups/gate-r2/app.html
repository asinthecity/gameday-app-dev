<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Game Day mock-up">
<title>MOCKUP - Game Day, second Gate R batch</title>
<style>
[hidden] { display: none !important; }

:root{--h:100vh}
@supports (height:100svh){:root{--h:100svh}}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%}
body{font-family:-apple-system,"Helvetica Neue",Arial,sans-serif;background:#fff;color:#111;font-size:16px;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
body.lock{position:fixed;left:0;right:0;top:0;bottom:0;overflow:hidden;overscroll-behavior:none}
body.nomove,body.nomove *{touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
button{-webkit-appearance:none;appearance:none;font:inherit;color:inherit;margin:0;cursor:pointer}

#frame{background:#fff;width:100%}
#frame.flow{min-height:var(--h)}
#frame.fix{height:var(--h);display:flex;flex-direction:column;overflow:hidden}
#frame.fix #screen{flex:1;min-height:0;display:flex;flex-direction:column}
@media (min-width:500px){
  html,body{background:#d9d9d9}
  #frame{width:393px;margin:0 auto}
  #frame.fix{height:min(var(--h),852px)}
}

/* Mock-up label and tools, outside the real screen */
#bar{flex:none;padding:env(safe-area-inset-top) 8px 3px;background:#111;color:#fff;font-size:12px}
#bar .br{display:flex;align-items:center;gap:8px;min-height:26px;white-space:nowrap;overflow:hidden}
#bar .mk{background:#ffd400;color:#111;font-weight:700;padding:2px 6px;border-radius:4px}
#bar .sp{flex:1}
#bar a{color:#9cc4ff;padding:4px 0;font-size:12px;text-decoration:underline}
#bar button{flex:none;height:28px;padding:0 9px;border:0;border-radius:6px;background:#444;color:#fff;font-size:13px;font-weight:700}

/* Common parts */
.hdr{display:flex;align-items:center;gap:8px;flex:none;min-height:53px;padding:4px 12px;border-bottom:2px solid #111;background:#fff}
.hdr h1{margin:0;font-size:20px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.back{flex:none;width:48px;height:44px;border:2px solid #111;border-radius:10px;background:#fff;font-size:26px;font-weight:700;line-height:1;padding:0 0 4px}
.tag{flex:none;background:#111;color:#fff;border-radius:6px;padding:2px 7px;font-size:12px;font-weight:800}
.body{padding:12px;display:flex;flex-direction:column;gap:12px}
.btn{display:flex;align-items:center;justify-content:center;width:100%;min-height:54px;border:2px solid #111;border-radius:12px;background:#fff;color:#111;font-size:18px;font-weight:800;padding:6px 12px;text-align:center}
.btn.pri{background:#111;color:#fff}
.btn.big{min-height:60px}
.btn[disabled]{background:#fff;color:#666;border:2px dashed #666;opacity:1;cursor:default}
.acts{flex:none;padding:8px 12px calc(8px + env(safe-area-inset-bottom));border-top:2px solid #111;background:#fff}
.acts .btn{min-height:56px;font-size:20px}
.acts.two{display:flex;gap:8px}
.acts.two .btn{flex:1;width:auto}
.acts.two .btn.pri{flex:2}
.acts.end{display:flex;justify-content:flex-end}
.acts .btn.eh{flex:none;width:132px;min-height:52px;background:#eee;border-color:#555;font-size:16px}
.acts .btn.eh.pri{background:#111;border-color:#111;color:#fff}
.av{width:100%;height:100%;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:17px;color:#111;border:2px solid #333}
.c0{background:#cfe3ff}.c1{background:#ffd9c2}.c2{background:#d7f0cf}.c3{background:#f5d0ee}.c4{background:#fff0a8}.c5{background:#cdeff0}.c6{background:#e1d4ff}.c7{background:#e6e6e6}

/* Home */
.card{border:2px solid #111;border-radius:12px;padding:10px;background:#f1f1f1;display:flex;flex-direction:column;gap:3px;overflow-wrap:anywhere}
.card b{font-size:18px}
.card .btn{margin-top:8px}

/* Forms */
.f label,.f .lb{display:flex;justify-content:space-between;font-size:14px;font-weight:700;margin-bottom:3px}
.f input{display:block;width:100%;min-width:0;min-height:52px;font-family:inherit;font-size:18px;color:#111;background:#fff;border:2px solid #111;border-radius:10px;padding:10px 12px;-webkit-appearance:none;appearance:none;margin:0}
.f input::-webkit-date-and-time-value{text-align:left;min-height:1.3em}
.f.need input{border:4px solid #b00020;padding:8px 10px}
.f .nw{color:#b00020;font-weight:800}

/* Rotation stepper */
.step{display:flex;align-items:center;gap:10px}
.step .btn{flex:none;width:72px;min-height:72px;padding:0;font-size:34px;touch-action:manipulation}
.val{flex:1;min-width:0;min-height:72px;display:flex;align-items:center;justify-content:center;border:2px solid #111;border-radius:10px;font-size:32px;font-weight:900;white-space:nowrap}

/* Sheet */
.scrim{position:fixed;left:0;right:0;top:0;bottom:0;z-index:20;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:393px;background:#fff;border-top:3px solid #111;border-radius:18px 18px 0 0;padding:16px 12px calc(14px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:10px}

/* Clock */
.bnr{flex:none;padding:6px 12px;font-size:15px;font-weight:800;background:#111;color:#fff}
.clk{position:relative;flex:none;display:flex;align-items:center;justify-content:center;min-height:52px;padding:2px 12px;border-bottom:2px solid #111;background:#fff}
.clk b{padding:0 8px;border-radius:8px;font-size:42px;font-weight:900;line-height:1.1;font-variant-numeric:tabular-nums}
.clk b.ot{background:#111;color:#fff}
.clk .hf{position:absolute;left:12px;top:50%;transform:translateY(-50%);font-size:13px;font-weight:800}

/* Strip */
.strip{flex:none;display:flex;align-items:center;gap:8px;min-height:64px;margin:6px 10px 0;padding:6px 10px;border:2px solid #111;border-radius:10px;background:#f4f4f4}
.strip .sl{flex:1;min-width:0}
.strip .big{font-size:22px;font-weight:900;line-height:26px;font-variant-numeric:tabular-nums}
.strip .who{font-size:15px;line-height:18px;overflow-wrap:anywhere}
.strip.warn{background:#ffd400}
.strip.swap{background:#111;color:#fff;border:4px solid #b00020;padding:4px 8px}
.strip.late{background:#b00020;border-color:#b00020;color:#fff}
.strip.time{background:#fff;border:6px solid #111;padding:2px 6px}
.strip.time .big{font-size:34px;line-height:40px;letter-spacing:2px;text-align:center}
.chip{flex:none;min-height:44px;min-width:64px;padding:0 8px;border:2px solid currentColor;border-radius:10px;background:transparent;color:inherit;font-size:16px;font-weight:800;white-space:nowrap}

/* Line-up and game */
.lu{position:relative;flex:1;min-height:0;display:flex;flex-direction:column;gap:6px;padding:6px 10px}
.pitch{flex:1 1 0;min-height:0;position:relative;display:grid;grid-template-rows:repeat(4,minmax(0,1fr));border:2px solid #111;border-radius:10px;background:#e6f0e0}
.pitch:before{content:"";position:absolute;left:0;right:0;top:50%;border-top:2px solid #b5c4ac;pointer-events:none}
.line{position:relative;display:flex;justify-content:center;align-items:stretch;min-height:0}
.slot{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:0}
.line .slot{flex:0 0 33.33%;max-width:33.33%}
.ci{position:relative;flex:none;width:48px;height:48px}
.nm{width:100%;margin-top:2px;padding:0 2px;text-align:center;font-size:14px;font-weight:800;line-height:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gk{position:absolute;right:-9px;top:-7px;width:24px;height:24px;border-radius:50%;background:#fff;border:2px solid #111;font-size:12px;line-height:1;display:flex;align-items:center;justify-content:center}
.tk{position:absolute;right:-9px;bottom:-5px;z-index:2;width:22px;height:22px;border-radius:50%;background:#111;border:2px solid #fff;color:#fff;font-size:13px;font-weight:900;line-height:1;display:flex;align-items:center;justify-content:center}
.em{background:transparent;border:2px dashed #555}
.tight .ci{width:40px;height:40px}
.tight .av{font-size:15px}
.tight .nm{font-size:13px;line-height:15px}
.row{position:relative;flex:none;display:flex;flex-wrap:wrap;justify-content:space-around;min-height:22px;padding:15px 4px 2px;border:2px solid #111;border-radius:10px;background:#fafafa}
.row .t{position:absolute;left:8px;top:1px;font-size:11px;font-weight:800;line-height:14px}
.row .slot{flex:0 0 16.6%;max-width:16.6%;padding:2px 0}
.row .ci{width:44px;height:44px}
.row .av{font-size:15px}
.row .nm{font-size:13px}
.row.ab{border-style:dashed}
.row.ab .av{border-style:dashed;border-color:#111}
.row.ab .nm{color:#333}

/* Bench on the game screen: ring, timer */
.row.live{padding:18px 4px 2px}
.row.live .slot{flex:1 1 0;max-width:25%}
.row.live .ci{width:52px;height:52px}
.row.live .av{position:absolute;left:6px;top:6px;width:40px;height:40px}
.row.live.many .slot{max-width:16.6%}
.row.live.many .ci{width:44px;height:44px}
.row.live.many .av{left:5px;top:5px;width:34px;height:34px;font-size:13px}
.rg{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none}
.rg circle{fill:none}
.r0{stroke:#c8c8c8;stroke-width:5}
.r1{stroke:#111;stroke-width:5}
.r2{stroke:#6b0012;stroke-width:4;display:none}
.lt .r0{stroke:#b00020}
.lt .r1{display:none}
.lt .r2{display:inline}
.tm{position:absolute;left:-9px;top:-7px;z-index:2;padding:1px 5px;border-radius:9px;background:#111;color:#fff;font-size:13px;font-weight:800;line-height:16px;white-space:nowrap;font-variant-numeric:tabular-nums}

/* Circle states */
.due .av{border:4px solid #111}
.plan .av{border:4px dotted #111}
.sel .av,.drop .av{border:4px solid #111;box-shadow:0 0 0 4px #ffd400}
.src .av{opacity:.4}

/* Planned pairs */
#pl{position:absolute;left:0;top:0;width:100%;height:100%;z-index:4;pointer-events:none;overflow:visible}
#px{position:absolute;left:0;top:0;width:100%;height:100%;z-index:5;pointer-events:none}
.xx{position:absolute;width:44px;height:44px;margin:-22px 0 0 -22px;padding:0;border:0;background:none;pointer-events:auto;display:flex;align-items:center;justify-content:center}
.xx span{width:26px;height:26px;border-radius:50%;background:#fff;border:3px solid #111;color:#111;font-size:18px;font-weight:900;line-height:1;display:flex;align-items:center;justify-content:center}

/* Swap and Undo */
.swr{flex:none;padding:8px 12px 0;border-top:2px solid #111;background:#fff}
.swr:not([hidden])+.acts{border-top:0}
.swp{min-height:60px;font-size:24px}
.undo{display:flex;align-items:center;gap:10px;min-height:60px;padding:6px 6px 6px 14px;border-radius:12px;background:#111;color:#fff;font-size:18px;font-weight:800}
.undo span{flex:1;min-width:0}
.undo button{flex:none;min-width:96px;min-height:48px;border:2px solid #fff;border-radius:10px;background:transparent;color:#fff;font-size:18px;font-weight:800}

/* Half over (temporary) */
.stop{padding:40px 0 28px;text-align:center;font-size:64px;font-weight:900;line-height:1;font-variant-numeric:tabular-nums}

/* Shorter phones, or Safari with its toolbars showing */
@media (max-height:760px){
  .pitch.g .ci{width:42px;height:42px}
  .pitch.g .av{font-size:15px}
  .pitch.g .nm{font-size:13px;line-height:15px}
}
@media (max-height:700px){
  .pitch.g .ci{width:38px;height:38px}
  .pitch.g .nm{margin-top:0;line-height:14px}
  .pitch.g .gk{width:20px;height:20px;font-size:10px}
  .pitch.g .tk{width:20px;height:20px;font-size:12px}
}

/* Drag layer */
#layer{position:fixed;left:0;top:0;right:0;bottom:0;z-index:50;pointer-events:none}
#layer svg{position:absolute;left:0;top:0;width:100%;height:100%}
#ghost{position:absolute;left:0;top:0;width:56px;height:56px;margin:-28px 0 0 -28px;will-change:transform}
#ghost .av{border:3px solid #111;box-shadow:0 3px 8px rgba(0,0,0,.45)}
</style>
</head>
<body>
<div id="frame"><div id="bar"></div><div id="screen"></div></div>
<div id="layer" hidden><svg><line id="ln" stroke="#111" stroke-width="5" stroke-linecap="round"></line></svg><div id="ghost"></div></div>
<script>
(function(){
'use strict';

/* ---------- Sample data (all names made up) ---------- */
var COL=['c0','c1','c2','c3','c4','c5','c6','c7'];
var SQ13=[['Alex',0],['Avery',4],['Casey',3],['Drew',1],['Jamie',0],['Jordan',2],['Kit',3],['Morgan',5],['Quinn',7],['Riley',4],['Robin',2],['Sam',1],['Thaddeus-Alexander',6]];
var DAYS=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
var MONTHS=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
var GHOST_LIFT=36;   /* the floating circle sits above the thumb so the thumb does not hide it */
var DROP_RADIUS=46;  /* how close to a circle counts as "on" it */
var HALF=1500;       /* 25:00 */
var WARN=30;         /* seconds of warning */
var RED_AFTER=60;    /* the strip and ring turn red one minute after Swap Time */
var UNDO_MS=5000;
var BANNER_MS=5000;
var REOPEN_GAP=348;  /* the Reopen button: closed for 5:48 */
var RING=2*Math.PI*23;
var RING2=2*Math.PI*17;
var TAGS='GDA-24 36 23 32 25 27 30 35 33';

/* ---------- State: held in memory only, gone on reload ---------- */
var S;
function fresh(){
  return {screen:'home',players:[],games:[],nextId:1,nextGame:1,nextCol:5,form:null,sel:null,gameId:null,lock:0,undo:null,wb:false,wbUntil:0,rotOpen:false};
}
function el(id){return document.getElementById(id);}
function esc(t){return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function initials(n){return n.slice(0,2).toUpperCase();}
function byName(a,b){var x=a.name.toLowerCase(),y=b.name.toLowerCase();return x<y?-1:(x>y?1:a.id-b.id);}
function sorted(){return S.players.slice().sort(byName);}
function P(id){for(var i=0;i<S.players.length;i++){if(S.players[i].id===id)return S.players[i];}return null;}
function idOf(name){for(var i=0;i<S.players.length;i++){if(S.players[i].name===name)return S.players[i].id;}return null;}
function addP(name,col){
  var c=(col===undefined||col===null)?(S.nextCol++%8):col;
  var p={id:S.nextId++,name:name,col:c};
  S.players.push(p);
  return p;
}
/* pos index: 0 goal, 1-3 defence, 4-6 midfield, 7-8 forwards, each left to right */
function addGame(date,time,opp,venue,rot){
  var s=sorted(),pos=[];
  for(var i=0;i<9;i++){pos.push(s[i]?s[i].id:null);}
  var g={id:S.nextGame++,date:date,time:time,opp:opp,venue:venue,formation:'3-3-2',pos:pos,absent:[],rot:rot||6,phase:'plan',t:0,endT:0,since:{},marks:{},pairs:[]};
  S.games.push(g);
  return g;
}
function cur(){for(var i=0;i<S.games.length;i++){if(S.games[i].id===S.gameId)return S.games[i];}return null;}
function benchOf(g){return sorted().filter(function(p){return g.pos.indexOf(p.id)<0&&g.absent.indexOf(p.id)<0;});}
function absentOf(g){return sorted().filter(function(p){return g.absent.indexOf(p.id)>=0;});}
function gamesInOrder(){
  return S.games.slice().sort(function(a,b){
    var x=a.date+a.time,y=b.date+b.time;
    return x<y?-1:(x>y?1:a.id-b.id);
  });
}
function fmtDate(d){
  var p=d.split('-'),dt=new Date(+p[0],+p[1]-1,+p[2]);
  return DAYS[dt.getDay()]+' '+(+p[2])+' '+MONTHS[+p[1]-1];
}
function fmtTime(t){
  var p=t.split(':'),h=+p[0],ap=h<12?'am':'pm',h12=h%12===0?12:h%12;
  return h12+':'+p[1]+' '+ap;
}
function mmss(s){var m=Math.floor(s/60),r=s%60;return m+':'+(r<10?'0':'')+r;}
function clockText(T){return T>HALF?'+'+mmss(T-HALF):mmss(T);}

/* ---------- Game rules ---------- */
function kick(g){
  g.phase='live';
  g.t=0;
  benchOf(g).forEach(function(p){g.since[p.id]=0;});
}
function plan(g,b,idx){
  var f=g.pos[idx];
  g.pairs=g.pairs.filter(function(p){
    if(p.b===b){return false;}
    return f?p.f!==f:p.pos!==idx;
  });
  g.pairs.push({b:b,f:f||null,pos:f?null:idx});
}
function fieldMove(g,i,j){
  var t=g.pos[i];
  g.pos[i]=g.pos[j];
  g.pos[j]=t;
  g.pairs.forEach(function(p){
    if(p.pos===j){p.f=g.pos[j];p.pos=null;}   /* the empty place in a plan has just been filled */
  });
}
function placeLive(a,b){
  var g=cur(),ka=a.charAt(0),kb=b.charAt(0),va=+a.slice(1),vb=+b.slice(1);
  if(ka==='p'&&kb==='p'){fieldMove(g,va,vb);}
  else if(ka==='b'&&kb==='p'){plan(g,va,vb);}
  else if(ka==='p'&&kb==='b'){plan(g,vb,va);}
  S.undo=null;   /* Undo goes as soon as anything else changes */
}
function doSwap(g){
  var T=Math.floor(g.t);
  var snap={pos:g.pos.slice(),since:JSON.parse(JSON.stringify(g.since)),marks:JSON.parse(JSON.stringify(g.marks)),pairs:JSON.parse(JSON.stringify(g.pairs))};
  g.pairs.forEach(function(p){
    var i=p.f?g.pos.indexOf(p.f):p.pos;
    g.pos[i]=p.b;
    g.marks[p.b]=true;
    delete g.since[p.b];
    if(p.f){g.since[p.f]=T;}
  });
  g.pairs=[];
  S.undo={snap:snap,until:Date.now()+UNDO_MS};
}
function endHalf(g){
  g.endT=Math.floor(g.t);
  g.pairs=[];
  S.undo=null;
  S.wb=false;
}
function isPlanned(g,k){
  var c=k.charAt(0),v=+k.slice(1);
  return g.pairs.some(function(p){
    if(c==='b'){return p.b===v;}
    if(c==='p'){return g.pos[v]?p.f===g.pos[v]:p.pos===v;}
    return false;
  });
}
function names(ids){return ids.map(function(id){return esc(P(id).name);}).join(', ');}
function stripState(g,T){
  if(T>=HALF){return {k:'time',big:'TIME',who:''};}
  var L=g.rot*60,due=[],warn=[],top=0;
  benchOf(g).forEach(function(p){
    var s=T-g.since[p.id];
    if(s>=L){due.push(p.id);}else if(s>=L-WARN){warn.push(p.id);}
    if(s>top){top=s;}
  });
  var list=due.length?due:warn;
  if(!list.length){return {k:'',big:'',who:''};}
  var offs=[],ons=[];
  g.pairs.forEach(function(p){
    ons.push(p.b);
    if(p.f){offs.push(p.f);}
  });
  list.forEach(function(id){if(ons.indexOf(id)<0){ons.push(id);}});
  var who=(offs.length?'<b>Off</b> '+names(offs)+' &rarr; ':'')+'<b>On</b> '+names(ons);
  if(!due.length){return {k:'warn',big:'SWAP IN '+mmss(L-top),who:who};}
  var late=top-L;
  return {k:late>=RED_AFTER?'late':'swap',big:'SWAP TIME'+(late>0?' +'+mmss(late):''),who:who};
}
function nextEvent(g){
  var T=Math.floor(g.t),L=g.rot*60,c=[HALF];
  benchOf(g).forEach(function(p){
    var s=g.since[p.id];
    c.push(s+L-WARN,s+L,s+L+RED_AFTER);
  });
  c=c.filter(function(x){return x>T;}).sort(function(a,b){return a-b;});
  return c.length?c[0]:null;
}

/* ---------- Starting points for the index page ---------- */
function squadN(n){SQ13.slice(0,n).forEach(function(x){addP(x[0],x[1]);});}
function squad13(){squadN(13);}
function squad15(){squad13();addP('Blake');addP('Extra');}
function rovers(){return addGame('2026-11-14','08:30','Rovers U10','Oakwood Park, Field 2',6);}
function markAbsent(g,list){
  list.forEach(function(n){
    var id=idOf(n),i=g.pos.indexOf(id);
    if(i>=0){g.pos[i]=null;}
    g.absent.push(id);
  });
}
function keyOf(g,name){
  var id=idOf(name),i=g.pos.indexOf(id);
  return i>=0?'p'+i:'b'+id;
}
function live(t,game){
  var g=game||rovers();
  kick(g);
  g.t=t;
  S.gameId=g.id;
  S.screen='game';
  return g;
}
function pair(g,on,off){plan(g,idOf(on),g.pos.indexOf(idOf(off)));}
function two(g){pair(g,'Riley','Kit');pair(g,'Robin','Jordan');}
function turn(g,t){   /* a Swap already carried out at game time t */
  g.t=t;
  two(g);

/* Everything that changes as the clock runs is updated in place, never rebuilt,
   so a tap or a drag in progress is not interrupted. */
function paint(){
  var g=cur();
  if(!g||(S.screen!=='game'&&S.screen!=='ready')){return;}
  var isLive=g.phase==='live',T=isLive?Math.floor(g.t):0;
  var st=isLive?stripState(g,T):{k:'',big:'',who:''};
  var ck=el('ck');
  ck.textContent=clockText(T);
  ck.className=T>HALF?'ot':'';
  el('st').className='strip '+st.k;
  el('chip').hidden=st.k==='time';
  el('chip').textContent=g.rot+' min';
  el('sl').hidden=!st.k;
  el('sb').textContent=st.big;
  var sw=el('sw');
  if(!drag&&sw.getAttribute('data-v')!==st.who){
    sw.innerHTML=st.who;
    sw.setAttribute('data-v',st.who);
    sw.hidden=!st.who;
  }
  if(!isLive){return;}
  el('bEnd').classList.toggle('pri',T>=HALF);
  var nx=el('tNext');
  if(nx){nx.hidden=T>=HALF;}
  var L=g.rot*60;
  benchOf(g).forEach(function(p){
    var n=document.querySelector('[data-k="b'+p.id+'"]');
    if(!n){return;}
    var s=T-g.since[p.id],over=s-L;
    var red=over>=RED_AFTER;
    n.querySelector('.tm').textContent=mmss(s);
    n.classList.toggle('due',s>=L-WARN);
    n.classList.toggle('lt',red);
    n.querySelector('.r1').setAttribute('stroke-dasharray',(Math.min(1,s/L)*RING).toFixed(1)+' '+RING.toFixed(1));
    n.querySelector('.r2').setAttribute('stroke-dasharray',(red?Math.min(1,over/L)*RING2:0).toFixed(1)+' '+RING2.toFixed(1));
  });
}
function syncRows(){
  var g=cur(),has=g.pairs.length>0,u=!!S.undo;
  el('bSwap').hidden=!has;
  el('und').hidden=has||!u;
  el('swr').hidden=!has&&!u;
  drawLines();
}
function drawLines(){
  var lu=document.querySelector('.lu.g'),svg=el('pl'),box=el('px'),g=cur();
  if(!lu||!svg||!box||!g){return;}
  var r=lu.getBoundingClientRect(),row=el('brow');
  var edge=row?row.getBoundingClientRect().top-r.top:r.height;
  var h='',x='';
  g.pairs.forEach(function(p){
    var i=p.f?g.pos.indexOf(p.f):p.pos;
    var a=document.querySelector('[data-k="b'+p.b+'"]'),b=document.querySelector('[data-k="p'+i+'"]');
    if(!a||!b){return;}
    var ca=centre(a),cb=centre(b);
    var x1=ca.x-r.left,y1=ca.y-r.top,x2=cb.x-r.left,y2=cb.y-r.top;
    var f=y2===y1?0.5:(edge-y1)/(y2-y1);
    var cx=Math.max(22,Math.min(r.width-22,x1+(x2-x1)*f));
    h+='<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="#111" stroke-width="4" stroke-dasharray="3 7" stroke-linecap="round"></line>';
    x+='<button class="xx" data-a="unpair" data-id="'+p.b+'" aria-label="Remove pair" style="left:'+cx+'px;top:'+edge+'px"><span>&times;</span></button>';
  });
  svg.innerHTML=h;
  box.innerHTML=x;
}

/* ---------- Line-up rules ---------- */
function moveKeys(a,b){
  if(S.screen==='game'){placeLive(a,b);return;}
  var g=cur(),ka=a.charAt(0),kb=b.charAt(0),va=+a.slice(1),vb=+b.slice(1);
  if(ka==='p'&&kb==='p'){var t=g.pos[va];g.pos[va]=g.pos[vb];g.pos[vb]=t;}
  else if(ka==='b'&&kb==='p'){g.pos[vb]=va;}
  else if(ka==='p'&&kb==='b'){g.pos[va]=vb;}
  /* whoever is displaced is on the bench automatically: the bench is everyone not placed and not absent */
}
function isEmptyPos(k){return k.charAt(0)==='p'&&cur().pos[+k.slice(1)]===null;}
function tap(k){
  var sel=S.sel,kk=k.charAt(0),empty=isEmptyPos(k);
  if(!sel){if(!empty){S.sel=k;}render();return;}
  if(sel===k){S.sel=null;render();return;}
  var ks=sel.charAt(0);
  if(empty){
    if(ks!=='a'){moveKeys(sel,k);S.sel=null;}
    render();return;
  }
  if((ks==='a'&&kk==='a')||(ks==='b'&&kk==='b')){S.sel=k;render();return;}
  if(ks==='a'||kk==='a'){return;}   /* changes nothing: the first player stays selected */
  moveKeys(sel,k);S.sel=null;render();
}
function canDrag(k){
  var c=k.charAt(0);
  return c==='b'||(c==='p'&&!isEmptyPos(k));
}
function validDrop(src,tgt){
  var s=src.charAt(0),t=tgt.charAt(0);
  if(t==='a'){return false;}
  if(t==='b'){return s==='p';}
  return true;
}
function playerAt(k){
  return k.charAt(0)==='p'?P(cur().pos[+k.slice(1)]):P(+k.slice(1));
}

/* ---------- Drag and tap: pointer events, one path for finger and mouse ---------- */
var drag=null;
function centre(n){
  var r=n.querySelector('.ci').getBoundingClientRect();
  return {x:r.left+r.width/2,y:r.top+r.height/2};
}
function startDrag(){
  var d=drag;
  d.on=true;
  S.sel=null;
  var old=document.querySelector('.slot.sel');
  if(old){old.classList.remove('sel');}
  syncBar();
  d.el.classList.add('src');
  var c=centre(d.el);
  d.targets=[];
  Array.prototype.forEach.call(document.querySelectorAll('[data-k]'),function(n){
    if(n!==d.el&&validDrop(d.k,n.getAttribute('data-k'))){
      var t=centre(n);
      d.targets.push({n:n,k:n.getAttribute('data-k'),x:t.x,y:t.y});
    }
  });
  var p=playerAt(d.k);
  el('ghost').innerHTML='<div class="av '+COL[p.col]+'">'+esc(initials(p.name))+'</div>';
  var ln=el('ln');
  ln.setAttribute('x1',c.x);
  ln.setAttribute('y1',c.y);
  el('layer').hidden=false;
}
function moveDrag(x,y){
  var d=drag,gy=y-d.lift;
  el('ghost').style.transform='translate('+x+'px,'+gy+'px)';
  var ln=el('ln');
  ln.setAttribute('x2',x);
  ln.setAttribute('y2',gy);
  var best=null,bd=DROP_RADIUS*DROP_RADIUS;
  d.targets.forEach(function(t){
    var dx=t.x-x,dy=t.y-gy,dist=dx*dx+dy*dy;
    if(dist<bd){bd=dist;best=t;}
  });
  if(best!==d.hit){
    if(d.hit){d.hit.n.classList.remove('drop');}
    if(best){best.n.classList.add('drop');}
    d.hit=best;
  }
}
function finish(apply){
  var d=drag;
  drag=null;
  if(d.on){
    el('layer').hidden=true;
    if(apply&&d.hit){moveKeys(d.k,d.hit.k);}
    render();
  }else if(apply&&!d.far){
    tap(d.k);
  }
}
document.addEventListener('pointerdown',function(e){
  if(drag||(S.screen!=='lineup'&&S.screen!=='game')||Date.now()<S.lock){return;}
  if(e.pointerType==='mouse'&&e.button!==0){return;}
  var n=e.target.closest?e.target.closest('[data-k]'):null;
  if(!n){return;}
  drag={id:e.pointerId,k:n.getAttribute('data-k'),el:n,x:e.clientX,y:e.clientY,on:false,far:false,lift:e.pointerType==='mouse'?0:GHOST_LIFT,targets:[],hit:null};
});
document.addEventListener('pointermove',function(e){
  if(!drag||e.pointerId!==drag.id){return;}
  if(!drag.on){
    var dx=e.clientX-drag.x,dy=e.clientY-drag.y;
    if(dx*dx+dy*dy<64){return;}
    drag.far=true;
    if(!canDrag(drag.k)){return;}
    startDrag();
  }
  e.preventDefault();
  moveDrag(e.clientX,e.clientY);
});
document.addEventListener('pointerup',function(e){
  if(drag&&e.pointerId===drag.id){finish(true);}
  /* the banner goes at the first tap, just after that tap has done its work */
  if(S.wb){S.wbUntil=Math.min(S.wbUntil,Date.now()+400);}
});
document.addEventListener('pointercancel',function(e){
  if(drag&&e.pointerId===drag.id){finish(false);}
});
/* Guards so the page cannot scroll, zoom or select text on the line-up. Must be non-passive. */
function guarded(){return document.body.classList.contains('nomove');}
document.addEventListener('touchmove',function(e){if(guarded()){e.preventDefault();}},{passive:false});
['gesturestart','selectstart','contextmenu','dragstart'].forEach(function(t){
  document.addEventListener(t,function(e){if(guarded()){e.preventDefault();}},{passive:false});
});

    render();
  },
  start:function(){kick(cur());nav('game');},
  chip:function(){S.rotOpen=true;el('rs').hidden=false;stepVal();},
  step:function(n){
    var o=rotOwner();
    o.rot=Math.max(1,Math.min(25,o.rot+(+n.getAttribute('data-d'))));
    stepVal();
    paint();
  },
  rotDone:function(){S.rotOpen=false;el('rs').hidden=true;},
  unpair:function(n){
    var g=cur(),id=+n.getAttribute('data-id');
    g.pairs=g.pairs.filter(function(p){return p.b!==id;});
    render();
  },
  swap:function(){
    S.sel=null;
    doSwap(cur());
    S.lock=Date.now()+300;   /* Undo appears where Swap was: a double tap must not hit it */
    render();
  },
  undo:function(){
    var g=cur(),s=S.undo&&S.undo.snap;
    if(!s){return;}
    g.pos=s.pos;
    g.since=s.since;
    g.marks=s.marks;
    g.pairs=s.pairs;
    S.undo=null;
    render();
  },
  endHalf:function(){endHalf(cur());nav('over');},
  backGame:function(){nav('game');},
  finish:function(){
    var id=S.gameId;
    S.games=S.games.filter(function(g){return g.id!==id;});
    S.gameId=null;
    nav('home');
  },
  /* Mock-up tools */
  plus1:function(){cur().t+=60;paint();},
  next:function(){
    var g=cur(),t=nextEvent(g);
    if(t!==null){g.t=t;paint();}
  },
  reopen:function(){
    cur().t+=REOPEN_GAP;
    S.sel=null;
    S.undo=null;
    S.rotOpen=false;
    if(S.screen==='game'){wake();}
    render();
  }
};
document.addEventListener('click',function(e){
  var n=e.target.closest?e.target.closest('[data-a]'):null;
  if(!n||n.disabled||Date.now()<S.lock){return;}
  e.preventDefault();
  ACT[n.getAttribute('data-a')](n);
});

/* ---------- Form fields ---------- */
function setNeed(key,on){
  S.form.marks[key]=on;
  var w=el('f-'+key);
  w.classList.toggle('need',on);
  w.querySelector('.nw').hidden=!on;
}
function onField(e){
  var t=e.target;
  var key=t.getAttribute&&t.getAttribute('data-f');
  if(!key||!S.form){return;}
  S.form[key]=t.value;
  if(t.value.trim()){setNeed(key,false);}
  el('make').disabled=!formOk();
}
document.addEventListener('input',onField);
document.addEventListener('change',onField);
document.addEventListener('focusout',function(e){
  var t=e.target,key=t.getAttribute&&t.getAttribute('data-f');
  if(rendering||!key||!S.form){return;}
  S.form[key]=t.value;
  if(!t.value.trim()){setNeed(key,true);}
});

/* ---------- The running clock ---------- */
var last=Date.now();
function tick(){
  var n=Date.now(),dt=(n-last)/1000,g=cur();
  last=n;
  if(g&&g.phase==='live'){g.t+=dt;}
  if(S.screen!=='game'){return;}
  if(S.undo&&n>S.undo.until&&!drag){S.undo=null;syncRows();}
  if(S.wb&&n>S.wbUntil&&!drag){S.wb=false;el('wb').hidden=true;drawLines();}
  paint();
}
window.addEventListener('resize',drawLines);

/* ---------- Start ---------- */
function boot(){
  var h=location.hash.slice(1);
  if(!Object.prototype.hasOwnProperty.call(SEEDS,h)){h='before';}
  S=fresh();
  SEEDS[h]();
  last=Date.now();
  render();
  window.scrollTo(0,0);
}
window.addEventListener('hashchange',boot);
boot();
setInterval(tick,200);
})();
</script>
</body>
</html>
